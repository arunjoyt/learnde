<!--
	Flashcards - paste this whole file into a Frappe Web Page
	(Content Type: HTML > Main Section (HTML)).
	Data source: Google Sheet. The first two columns are the two sides of each card;
	their header names are used as the card labels.
	The sheet must be shared as "Anyone with the link can view".
-->
<div id="fc-app">
	<style>
		#fc-app {
			--fc-bg: #ffffff;
			--fc-fg: #1f2933;
			--fc-muted: #6b7280;
			--fc-accent: #2563eb;
			--fc-card: #f8fafc;
			--fc-border: #e5e7eb;
			--fc-back-bg: #eff6ff;
			--fc-back-border: #bfdbfe;
			--fc-error: #dc2626;
			max-width: 560px;
			margin: 24px auto;
			padding: 0 16px;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			color: var(--fc-fg);
			text-align: center;
		}
		html.fc-dark,
		html.fc-dark body {
			background: #0f172a;
			color: #e5e7eb;
			color-scheme: dark;
		}
		/* Frappe website navbar and footer */
		html.fc-dark .navbar,
		html.fc-dark .web-footer,
		html.fc-dark .dropdown-menu {
			background: #0f172a !important;
			border-color: #1e293b !important;
		}
		html.fc-dark .navbar a,
		html.fc-dark .navbar .navbar-brand,
		html.fc-dark .web-footer,
		html.fc-dark .web-footer a,
		html.fc-dark .dropdown-menu a {
			color: #cbd5e1 !important;
		}
		html.fc-dark .dropdown-menu a:hover {
			background: #1e293b !important;
		}
		html.fc-dark .navbar-toggler-icon {
			filter: invert(1);
		}
		html.fc-dark #fc-app {
			--fc-bg: #1e293b;
			--fc-fg: #e5e7eb;
			--fc-muted: #94a3b8;
			--fc-accent: #3b82f6;
			--fc-card: #1e293b;
			--fc-border: #334155;
			--fc-back-bg: #172554;
			--fc-back-border: #1e40af;
			--fc-error: #f87171;
		}
		#fc-app .fc-top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 12px;
			color: var(--fc-muted);
			font-size: 14px;
			gap: 8px;
		}
		#fc-app .fc-top-right {
			display: flex;
			gap: 8px;
			min-width: 0;
		}
		#fc-app #fc-count,
		#fc-app #fc-theme {
			flex-shrink: 0;
			white-space: nowrap;
		}
		#fc-app #fc-dir {
			min-width: 0;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		#fc-app .fc-card {
			position: relative;
			min-height: 240px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 24px;
			background: var(--fc-card);
			border: 1px solid var(--fc-border);
			border-radius: 16px;
			cursor: pointer;
			user-select: none;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
		}
		#fc-app .fc-card.fc-back {
			background: var(--fc-back-bg);
			border-color: var(--fc-back-border);
		}
		#fc-app .fc-label {
			position: absolute;
			top: 12px;
			left: 16px;
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--fc-muted);
		}
		#fc-app .fc-text {
			font-size: 32px;
			font-weight: 600;
			line-height: 1.3;
			word-break: break-word;
		}
		#fc-app .fc-hint {
			margin-top: 12px;
			font-size: 13px;
			color: var(--fc-muted);
		}
		#fc-app .fc-controls {
			display: flex;
			gap: 8px;
			justify-content: center;
			flex-wrap: wrap;
			margin-top: 16px;
		}
		#fc-app button {
			padding: 10px 16px;
			font-size: 15px;
			border-radius: 8px;
			border: 1px solid var(--fc-border);
			background: var(--fc-bg);
			color: var(--fc-fg);
			cursor: pointer;
		}
		#fc-app button.fc-primary {
			background: var(--fc-accent);
			border-color: var(--fc-accent);
			color: #fff;
		}
		#fc-app button:disabled {
			opacity: 0.5;
			cursor: default;
		}
		#fc-app .fc-msg {
			padding: 40px 0;
			color: var(--fc-muted);
		}
		@media (max-width: 480px) {
			#fc-app .fc-controls {
				flex-wrap: nowrap;
				gap: 6px;
			}
			#fc-app .fc-controls button {
				flex: 1 1 0;
				padding: 10px 4px;
				font-size: 14px;
			}
			#fc-app .fc-text {
				font-size: 28px;
			}
			#fc-app .fc-top button {
				padding: 8px 10px;
				font-size: 14px;
			}
			#fc-app .fc-theme-text {
				display: none;
			}
		}
		#fc-app .fc-settings {
			margin-top: 24px;
			text-align: left;
			font-size: 14px;
			border: 1px solid var(--fc-border);
			border-radius: 8px;
			padding: 8px 12px;
		}
		#fc-app .fc-settings summary {
			cursor: pointer;
			color: var(--fc-muted);
		}
		#fc-app .fc-settings-row {
			display: flex;
			gap: 8px;
			margin-top: 8px;
			flex-wrap: wrap;
		}
		#fc-app .fc-settings input {
			flex: 1 1 240px;
			min-width: 0;
			padding: 8px 10px;
			font-size: 14px;
			border: 1px solid var(--fc-border);
			border-radius: 8px;
			background: var(--fc-bg);
			color: var(--fc-fg);
		}
		#fc-app .fc-settings-error {
			margin-top: 8px;
			color: var(--fc-error);
			font-size: 13px;
		}
		#fc-app .fc-settings-error:empty {
			display: none;
		}
		#fc-app .fc-settings-note {
			margin-top: 8px;
			color: var(--fc-muted);
			font-size: 12px;
		}
	</style>

	<div class="fc-top">
		<span id="fc-count"></span>
		<span class="fc-top-right">
			<button id="fc-dir" type="button"></button>
			<button id="fc-theme" type="button" title="Theme"></button>
		</span>
	</div>

	<div id="fc-body"><div class="fc-msg">Loading cards&hellip;</div></div>

	<div class="fc-controls">
		<button id="fc-prev" type="button">&larr; Prev</button>
		<button id="fc-flip" type="button" class="fc-primary">Flip</button>
		<button id="fc-next" type="button">Next &rarr;</button>
		<button id="fc-shuffle" type="button">Shuffle</button>
	</div>

	<details class="fc-settings" id="fc-settings">
		<summary>Google Sheet</summary>
		<div class="fc-settings-row">
			<input id="fc-url" type="url" placeholder="https://docs.google.com/spreadsheets/d/&hellip;" />
			<button id="fc-load" type="button" class="fc-primary">Load</button>
			<button id="fc-reset" type="button">Default</button>
		</div>
		<div class="fc-settings-error" id="fc-url-error"></div>
		<div class="fc-settings-note">
			The first two columns are the card sides; the header row gives their names. Share the sheet as "Anyone with the link can view".
			The link is remembered in this browser.
		</div>
	</details>

	<script>
		(function () {
			var DEFAULT_URL =
				"https://docs.google.com/spreadsheets/d/1PAR2CWXiN2aFeoJqJ9Eos3DwkoDvdqs83wTb8Ry3e3c/edit?usp=sharing";
			var STORAGE_KEY = "learnde-flashcards-sheet";
			var THEME_KEY = "learnde-flashcards-theme";
			var THEMES = ["auto", "light", "dark"];
			var THEME_ICONS = { auto: "\u25D0", light: "\u2600", dark: "\u263E" };
			var THEME_NAMES = { auto: "Auto", light: "Light", dark: "Dark" };

			var cards = [];
			var index = 0;
			var flipped = false;
			var labels = ["", ""];
			var reversed = false;
			var loadId = 0;

			var $ = function (id) {
				return document.getElementById(id);
			};

			function parseCSV(text) {
				var rows = [];
				var row = [];
				var field = "";
				var inQuotes = false;
				for (var i = 0; i < text.length; i++) {
					var c = text[i];
					if (inQuotes) {
						if (c === '"' && text[i + 1] === '"') {
							field += '"';
							i++;
						} else if (c === '"') {
							inQuotes = false;
						} else {
							field += c;
						}
					} else if (c === '"') {
						inQuotes = true;
					} else if (c === ",") {
						row.push(field);
						field = "";
					} else if (c === "\n" || c === "\r") {
						if (c === "\r" && text[i + 1] === "\n") i++;
						row.push(field);
						rows.push(row);
						row = [];
						field = "";
					} else {
						field += c;
					}
				}
				if (field !== "" || row.length) {
					row.push(field);
					rows.push(row);
				}
				return rows;
			}

			function shuffle(arr) {
				for (var i = arr.length - 1; i > 0; i--) {
					var j = Math.floor(Math.random() * (i + 1));
					var t = arr[i];
					arr[i] = arr[j];
					arr[j] = t;
				}
			}

			function escapeHTML(s) {
				var d = document.createElement("div");
				d.textContent = s;
				return d.innerHTML;
			}

			function render() {
				var empty = !cards.length;
				["fc-prev", "fc-flip", "fc-next", "fc-shuffle"].forEach(function (id) {
					$(id).disabled = empty;
				});
				$("fc-dir").textContent = empty
					? ""
					: reversed
						? labels[1] + " \u2192 " + labels[0]
						: labels[0] + " \u2192 " + labels[1];
				$("fc-dir").style.visibility = empty ? "hidden" : "";
				if (empty) {
					$("fc-count").textContent = "";
					$("fc-body").innerHTML = '<div class="fc-msg">No cards found in the sheet.</div>';
					return;
				}
				var card = cards[index];
				var side = reversed !== flipped ? 1 : 0;
				$("fc-count").textContent = "Card " + (index + 1) + " / " + cards.length;
				$("fc-body").innerHTML =
					'<div class="fc-card' + (flipped ? " fc-back" : "") + '" id="fc-card">' +
					'<span class="fc-label">' + escapeHTML(labels[side]) + "</span>" +
					'<div class="fc-text">' + escapeHTML(card[side]) + "</div>" +
					'<div class="fc-hint">' + (flipped ? "" : "Tap card to flip") + "</div>" +
					"</div>";
				$("fc-card").onclick = flip;
			}

			function flip() {
				flipped = !flipped;
				render();
			}

			function go(step) {
				index = (index + step + cards.length) % cards.length;
				flipped = false;
				render();
			}

			$("fc-flip").onclick = flip;
			$("fc-prev").onclick = function () {
				go(-1);
			};
			$("fc-next").onclick = function () {
				go(1);
			};
			$("fc-shuffle").onclick = function () {
				shuffle(cards);
				index = 0;
				flipped = false;
				render();
			};
			$("fc-dir").onclick = function () {
				reversed = !reversed;
				flipped = false;
				render();
			};

			document.addEventListener("keydown", function (e) {
				if (!cards.length || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
				if (e.key === "ArrowRight") go(1);
				else if (e.key === "ArrowLeft") go(-1);
				else if (e.key === " " || e.key === "Enter") {
					e.preventDefault();
					flip();
				}
			});

			// Turn any Google Sheets link (edit/share URL) into its CSV export URL.
			function toCsvUrl(link) {
				var id = (link.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/) || [])[1];
				if (!id) return null;
				var gid = (link.match(/[#&?]gid=(\d+)/) || [])[1];
				return (
					"https://docs.google.com/spreadsheets/d/" +
					id +
					"/gviz/tq?tqx=out:csv" +
					(gid ? "&gid=" + gid : "")
				);
			}

			function getSaved() {
				try {
					return localStorage.getItem(STORAGE_KEY);
				} catch (e) {
					return null;
				}
			}

			function setSaved(link) {
				try {
					if (link) localStorage.setItem(STORAGE_KEY, link);
					else localStorage.removeItem(STORAGE_KEY);
				} catch (e) {}
			}

			$("fc-load").onclick = function () {
				var link = $("fc-url").value.trim();
				if (!toCsvUrl(link)) {
					$("fc-url-error").textContent = "That does not look like a Google Sheets link.";
					return;
				}
				$("fc-url-error").textContent = "";
				load(link);
			};
			$("fc-reset").onclick = function () {
				setSaved(null);
				$("fc-url-error").textContent = "";
				$("fc-url").value = DEFAULT_URL;
				load(DEFAULT_URL);
			};

			var systemDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
			var theme = "auto";
			try {
				theme = localStorage.getItem(THEME_KEY) || "auto";
			} catch (e) {}
			if (THEMES.indexOf(theme) < 0) theme = "auto";

			function applyTheme() {
				var dark = theme === "dark" || (theme === "auto" && systemDark && systemDark.matches);
				document.documentElement.classList.toggle("fc-dark", !!dark);
				$("fc-theme").innerHTML =
					THEME_ICONS[theme] + '<span class="fc-theme-text"> ' + THEME_NAMES[theme] + "</span>";
				$("fc-theme").title = "Theme: " + THEME_NAMES[theme];
			}

			$("fc-theme").onclick = function () {
				theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
				try {
					if (theme === "auto") localStorage.removeItem(THEME_KEY);
					else localStorage.setItem(THEME_KEY, theme);
				} catch (e) {}
				applyTheme();
			};
			if (systemDark && systemDark.addEventListener) systemDark.addEventListener("change", applyTheme);
			applyTheme();

			var initial = getSaved() || DEFAULT_URL;
			$("fc-url").value = initial;
			load(initial);

			function load(link) {
				var request = ++loadId;
				cards = [];
				index = 0;
				flipped = false;
				["fc-prev", "fc-flip", "fc-next", "fc-shuffle"].forEach(function (id) {
					$(id).disabled = true;
				});
				$("fc-count").textContent = "";
				$("fc-body").innerHTML = '<div class="fc-msg">Loading cards\u2026</div>';

				fetch(toCsvUrl(link))
					.then(function (r) {
						if (!r.ok) throw new Error("HTTP " + r.status);
						return r.text();
					})
					.then(function (text) {
						if (request !== loadId) return;
						if (/^\s*</.test(text)) throw new Error("sheet is not public");
						var rows = parseCSV(text);
						var header = rows.shift() || [];
						labels = [(header[0] || "").trim() || "Front", (header[1] || "").trim() || "Back"];
						cards = rows
							.map(function (r) {
								return [(r[0] || "").trim(), (r[1] || "").trim()];
							})
							.filter(function (c) {
								return c[0] && c[1];
							});
						setSaved(link === DEFAULT_URL ? null : link);
						shuffle(cards);
						render();
					})
					.catch(function (err) {
						if (request !== loadId) return;
						$("fc-body").innerHTML =
							'<div class="fc-msg">Could not load cards (' +
							escapeHTML(err.message) +
							"). Check the link and that the sheet is shared as \"Anyone with the link\".</div>";
					});
			}
		})();
	</script>
</div>
